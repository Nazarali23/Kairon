[project]
name = "kaironagent"
version = "0.1.0"
description = "ESP32 Kairon Robotu için Windows PC Otonom Yürütme Ajanı"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "tenacity>=8.3.0",
    "keyring>=25.2.0",
    "groq>=0.9.0",
    "pywin32>=306; sys_platform == 'win32'",
    "uiautomation>=2.0.19; sys_platform == 'win32'",
    "pynput>=1.7.7",
    "pystray>=0.19.5",
    "pillow>=10.3.0",
    "pypdf>=4.2.0",
    "python-dotenv>=1.0.1"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
